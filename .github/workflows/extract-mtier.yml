
name: Extract M-TIER source from ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mtier-source-extraction
  cancel-in-progress: false

jobs:
  extract:
    name: Extract and publish Flutter source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Extract source archive safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile, BadZipFile
          import shutil
          import stat

          archive = Path("MTIER-4.0-DEZIPPE-VERSION-A-POUR-GITHUB.zip")
          output = Path("/tmp/mtier-source")

          if not archive.is_file():
              raise SystemExit(f"Archive introuvable : {archive}")

          if output.exists():
              shutil.rmtree(output)
          output.mkdir(parents=True)

          try:
              with ZipFile(archive) as zf:
                  entries = [e for e in zf.infolist() if e.filename]
                  files = [e for e in entries if not e.is_dir()]

                  if not files:
                      raise SystemExit("Archive ZIP vide.")

                  parsed = []
                  for entry in entries:
                      name = entry.filename
                      path = PurePosixPath(name)

                      if chr(92) in name or path.is_absolute():
                          raise SystemExit(f"Chemin interdit : {name}")

                      if not path.parts or ".." in path.parts:
                          raise SystemExit(f"Chemin interdit : {name}")

                      if path.parts[0].endswith(":"):
                          raise SystemExit(f"Lecteur interdit : {name}")

                      mode = (entry.external_attr >> 16) & 0o170000
                      if mode == stat.S_IFLNK:
                          raise SystemExit(f"Lien symbolique interdit : {name}")

                      parsed.append((entry, path.parts))

                  roots = {parts[0] for _, parts in parsed}
                  strip_root = (
                      len(roots) == 1
                      and all(len(parts) > 1 for e, parts in parsed if not e.is_dir())
                  )
                  root = next(iter(roots)) if strip_root else None

                  for entry, parts in parsed:
                      if strip_root and parts[0] == root:
                          parts = parts[1:]

                      if not parts:
                          continue

                      target = output.joinpath(*parts)

                      if entry.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue

                      target.parent.mkdir(parents=True, exist_ok=True)

                      with zf.open(entry) as src, target.open("wb") as dst:
                          shutil.copyfileobj(src, dst)

          except BadZipFile:
              raise SystemExit("L'archive ZIP est invalide.")

          required = ["pubspec.yaml", "lib/main.dart"]
          missing = [f for f in required if not (output / f).is_file()]

          if missing:
              raise SystemExit(
                  "Structure Flutter incomplète : " + ", ".join(missing)
              )

          print("Extraction et vérification réussies.")

      - name: Copy source files to repository
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/mtier-source/. .

      - name: Remove transfer archives
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            MTIER-4.0-DEZIPPE-VERSION-A-POUR-GITHUB.zip \
            MTIER-4.0-IMPORT-LOT-1.zip \
            MTIER-4.0-IMPORT-LOT-2.zip

      - name: Verify Flutter structure
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          test -f lib/main.dart
          test -d assets
          test -d test
          echo "Structure Flutter vérifiée."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi

          git commit -m "Extract M-TIER 4.0 source files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          
